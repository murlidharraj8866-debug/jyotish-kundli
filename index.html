<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jyotish Kundli</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f7f3ed;color:#2b2118}.wrap{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#5b2618,#a85c2a);color:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0002}.hero h1{margin:0 0 5px}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 3px 18px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#7c351e;color:white}button.secondary{background:#eee;color:#3b2b22}button.danger{background:#a21d1d}.profiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{padding:10px;border:1px dashed #cbbdb2;border-radius:12px;background:#fff;min-height:80px}.slot strong{display:block}.slot button{font-size:12px;padding:6px;margin-top:6px}.hidden{display:none}.tabs{display:flex;gap:6px;overflow:auto;margin-top:12px}.tab{background:#eee;color:#333;white-space:nowrap}.tab.active{background:#7c351e;color:#fff}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #eee;padding:8px;text-align:left;white-space:nowrap}.pill{display:inline-block;padding:4px 8px;background:#f1e3d9;border-radius:999px;margin:3px;font-size:12px}.err{color:#a21d1d;font-weight:700}.loading{opacity:.65;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.profiles{grid-template-columns:repeat(2,1fr)}}@media print{.no-print{display:none!important}body{background:white}.card,.hero{box-shadow:none;border:1px solid #ddd}.wrap{max-width:none}}
</style></head><body><div class="wrap">
<section class="hero"><h1>🔱 Jyotish Kundli</h1><div>Vedic • Lahiri • D1 • D9 • Vimshottari • Yog/Dosh • Traditional Predictions</div></section>
<section class="card no-print"><h2>5 Profile Slots</h2><div class="profiles" id="profiles"></div></section>
<section class="card no-print"><h2>Birth Details</h2><div class="grid"><div class="field"><label>Name</label><input id="name" placeholder="Name"></div><div class="field"><label>Gender</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="field"><label>Date of Birth</label><input id="date" type="date"></div><div class="field"><label>Birth Time</label><input id="time" type="time"></div><div class="field" style="grid-column:1/-1"><label>Birth Place</label><input id="place" placeholder="City, State, Country e.g. Surat, Gujarat, India"></div></div><div class="buttons"><button onclick="saveProfile()">💾 Save Profile</button><button onclick="calculate()">🔮 Generate Kundli</button><button class="secondary" onclick="window.print()">🖨️ Print / Save PDF</button><button class="secondary" onclick="clearForm()">Clear</button></div><div id="msg"></div></section>
<section id="result" class="card hidden"><h2 id="title"></h2><div id="summary"></div><div class="tabs"><button class="tab active" onclick="showTab('overview',this)">Overview</button><button class="tab" onclick="showTab('planets',this)">Planets</button><button class="tab" onclick="showTab('dasha',this)">Dasha</button><button class="tab" onclick="showTab('yoga',this)">Yog/Dosh</button><button class="tab" onclick="showTab('pred',this)">Predictions</button><button class="tab" onclick="showTab('d9',this)">D9</button></div><div id="content"></div></section></div>
<script>
let current=null, activeProfile=0; const KEY='jyotish_profiles_v1';
function profiles(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function renderProfiles(){const a=profiles();document.getElementById('profiles').innerHTML=Array.from({length:5},(_,i)=>{let p=a[i];return `<div class="slot"><strong>${i+1}. ${p?.name||'Empty'}</strong><small>${p?.date||''} ${p?.time||''}</small><br><button class="secondary" onclick="loadProfile(${i})">Load</button> ${p?`<button class="danger" onclick="deleteProfile(${i})">Delete</button>`:''}</div>`}).join('')}
function vals(){return {name:document.getElementById('name').value.trim(),gender:document.getElementById('gender').value,date:document.getElementById('date').value,time:document.getElementById('time').value,place:document.getElementById('place').value.trim()}}
function fill(p){for(const k of ['name','date','time','place'])document.getElementById(k).value=p[k]||'';document.getElementById('gender').value=p.gender||'Male'}
function saveProfile(){let p=vals();if(!p.name||!p.date||!p.time||!p.place)return message('Name, date, time और place भरें',true);let a=profiles();a[activeProfile]=p;localStorage.setItem(KEY,JSON.stringify(a));renderProfiles();message(`Profile ${activeProfile+1} में save हो गया।`)}
function loadProfile(i){let p=profiles()[i];if(!p)return message(`Profile ${i+1} खाली है`,true);activeProfile=i;fill(p);message(`Profile ${i+1} loaded.`)}
function deleteProfile(i){let a=profiles();a[i]=null;localStorage.setItem(KEY,JSON.stringify(a));renderProfiles();if(activeProfile===i)clearForm();}
function clearForm(){fill({gender:'Male'});document.getElementById('result').classList.add('hidden');message('')}
function message(t,err=false){document.getElementById('msg').innerHTML=t?`<p class="${err?'err':''}">${t}</p>`:''}
async function calculate(){let p=vals();if(!p.date||!p.time||!p.place)return message('Date, time और birth place जरूरी है',true);message('Calculation हो रही है…');document.body.classList.add('loading');try{let r=await fetch('/api/kundli',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j=await r.json();if(!j.ok)throw Error(j.error);current=j.data;render(current);message('Kundli तैयार है।')}catch(e){message(e.message||'Calculation error',true)}finally{document.body.classList.remove('loading')}}
function showTab(t,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderContent(t)}
function render(d){document.getElementById('result').classList.remove('hidden');document.getElementById('title').textContent=`${d.name||'Kundli'} — Birth Chart`;renderContent('overview')}
function chips(a){return (a||[]).map(x=>`<span class="pill">${x}</span>`).join('')}
function renderContent(t){let d=current,c='';if(!d)return;if(t==='overview'){c=`<div class="grid"><div><b>Lagna:</b> ${d.lagna.sign_hi} (${d.lagna.sign}) ${d.lagna.degree}°</div><div><b>Rashi:</b> ${d.rashi_hi} (${d.rashi})</div><div><b>Nakshatra:</b> ${d.nakshatra}</div><div><b>Nakshatra Lord:</b> ${d.nakshatra_lord}</div><div><b>Birth Place:</b> ${d.birth.place}</div><div><b>Timezone:</b> ${d.birth.timezone}</div></div><h3>House Lords</h3><div>${Object.entries(d.house_lords).map(([h,l])=>`<span class="pill">${h}H: ${l}</span>`).join('')}</div><h3>Quick checks</h3><p>Mangal Dosha: <b>${d.mangal.flag?'Yes (traditional screening)':'No (basic screening)'}</b></p>`}else if(t==='planets'){c=`<div class="tablewrap"><table><tr><th>Planet</th><th>Sign</th><th>House</th><th>Degree</th><th>Nakshatra</th><th>Pada</th><th>D9</th><th>Status</th><th>Retro</th><th>Aspects</th></tr>${d.planets.map(p=>`<tr><td>${p.name}</td><td>${p.sign_hi}</td><td>${p.house}</td><td>${p.degree}°</td><td>${p.nakshatra}</td><td>${p.pada}</td><td>${p.navamsa}</td><td>${p.status}</td><td>${p.retrograde?'Yes':'No'}</td><td>${p.aspects.join(', ')}</td></tr>`).join('')}</table></div>`}else if(t==='dasha'){c=`<h3>Vimshottari Mahadasha</h3><div class="tablewrap"><table><tr><th>Lord</th><th>Start</th><th>End</th><th>Years</th></tr>${d.dasha.periods.map(x=>`<tr><td>${x.lord}</td><td>${x.start_text}</td><td>${x.end_text}</td><td>${x.years}</td></tr>`).join('')}</table></div><h3>Antardasha</h3>${d.dasha.periods.slice(0,3).map(x=>`<p><b>${x.lord} MD:</b> ${x.antardasha.map(a=>`${a.lord} (${a.start_text}–${a.end_text})`).join(' • ')}</p>`).join('')}`}else if(t==='yoga'){c=`<h3>Yog Checks</h3>${d.yogas.length?d.yogas.map(y=>`<div class="card"><b>${y[0]}</b><p>${y[1]}</p></div>`).join(''):'<p>No named yoga matched by the included basic rules.</p>'}<h3>Mangal Dosha</h3><p>${d.mangal.flag?'Mars is in a traditionally screened Manglik house: '+d.mangal.house:'Mars is not in the basic screened houses.'} ${d.mangal.note}</p>`}else if(t==='pred'){c=`<h3>Marriage</h3>${d.pred.marriage.map(x=>`<p>• ${x}</p>`).join('')}<h3>Career</h3>${d.pred.career.map(x=>`<p>• ${x}</p>`).join('')}<h3>Finance</h3>${d.pred.finance.map(x=>`<p>• ${x}</p>`).join('')}<hr><small>Interpretations are traditional Jyotish observations, not scientifically validated predictions.</small>`}else if(t==='d9'){c=`<div class="tablewrap"><table><tr><th>Planet</th><th>Navamsa Sign</th><th>D9 House</th></tr>${d.d9planets.map(p=>`<tr><td>${p.name}</td><td>${p.sign}</td><td>${p.house}</td></tr>`).join('')}</table></div>`}document.getElementById('content').innerHTML=c}
renderProfiles();
</script></body></html>
